[Server List Version]
VER=1001

# Gateway list served to Diablo II Classic (D2DV) clients.
# Each entry becomes one selectable gateway in the Battle.net connection screen.
# ZONE affects which timezone offset the client displays for game times.
#
# To add your own realm:
#   1. Add a numbered entry under [Server Gateways]
#   2. Add a matching section with ZONE and at least an ENU (English) label
#
# Common ZONE values (UTC offset in hours, negated):
#   -12 = UTC+12   -9 = UTC+9 (JST)   -8 = UTC+8 (CST)
#   -5  = UTC+5    -1 = UTC+1 (CET)    0 = UTC     6 = UTC-6 (CST US)
#   7   = UTC-7 (MST)   8 = UTC-8 (PST)

[Server Gateways]
1=pvpgn.realm

